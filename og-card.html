<!doctype html>
<html><head><meta charset="utf-8"><title>og</title>
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff}
.card{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:1fr 440px}

h1{font-size:78px;line-height:.98;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{font-size:27px;color:#D9D9D9;line-height:1.3;max-width:600px;margin-top:22px}
.url{font-size:22px;color:#A7A9AC}
.right{background:#F0EAD8;position:relative;overflow:hidden}
.right svg{position:absolute;inset:0;width:100%;height:100%}
</style></head><body>
